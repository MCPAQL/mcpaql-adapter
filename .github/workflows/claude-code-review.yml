name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}

            ## Project Context

            This is the **MCP-AQL Reference Adapter** repository. It contains the reference implementation of the MCP-AQL protocol, which consolidates MCP tools into semantic CRUDE endpoints with ~96% token reduction.

            Key concepts:
            - **CRUDE Pattern**: Create, Read, Update, Delete, Execute endpoints
            - **Introspection**: Runtime operation discovery via `introspect` operation
            - **Discriminated Responses**: `{ success: true, data }` or `{ success: false, error }`
            - **Adapters**: Declarative Markdown files with YAML front matter defining API mappings

            The normative specification lives in the sibling `spec` repository. This repo contains implementation architecture documentation and (when available) TypeScript source code.

            ## Review Instructions

            Please review this pull request thoroughly. Check the PR diff using `gh pr diff`.

            ### For Architecture Documentation (docs/architecture/*.md)

            1. **Technical Accuracy**
               - Are the architecture descriptions correct and internally consistent?
               - Do they accurately reflect the implementation patterns described?
               - Are cross-references to the spec repo accurate and up to date?

            2. **Implementation Quality**
               - Are design patterns well-justified and appropriate?
               - Is the separation of concerns clear?
               - Are extension points and plugin boundaries well-defined?

            3. **Consistency with Spec**
               - Do implementation details align with normative definitions in the spec repo?
               - Are CRUDE operation semantics correctly implemented?
               - Is introspection behavior consistent with the protocol specification?

            ### For TypeScript Code (src/**/*.ts, when present)

            1. **Correctness** - Does the code implement the spec faithfully?
            2. **Type Safety** - Are TypeScript types properly used?
            3. **Error Handling** - Are discriminated responses used correctly?
            4. **Testing** - Are tests present and meaningful?

            ### For All Files

            1. **Markdown quality** - Proper formatting, no lint errors expected
            2. **Spelling** - No typos in prose
            3. **Links** - All links should be valid

            ## Output Format

            Provide a structured review with:

            1. **Summary** - One paragraph overview of the changes
            2. **Strengths** - What the PR does well (2-3 points)
            3. **Issues Found** - Specific problems that should be addressed, with file:line references
            4. **Suggestions** - Optional improvements (clearly marked as non-blocking)
            5. **Verdict** - APPROVE, REQUEST_CHANGES, or COMMENT

            Use `gh pr comment` for top-level feedback.

          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Glob,Grep"
