name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}
            TRIGGER: ${{ github.event.action }}

            ## Project Context

            This is the **MCP-AQL Reference Adapter** repository. It contains the reference implementation of the MCP-AQL protocol, which consolidates MCP tools into semantic CRUDE endpoints with ~96% token reduction.

            Key concepts:
            - **CRUDE Pattern**: Create, Read, Update, Delete, Execute endpoints
            - **Introspection**: Runtime operation discovery via `introspect` operation
            - **Discriminated Responses**: `{ success: true, data }` or `{ success: false, error }`
            - **Adapters**: Declarative Markdown files with YAML front matter defining API mappings

            The normative specification lives in the sibling `spec` repository. This repo contains implementation architecture documentation and (when available) TypeScript source code.

            ## Review Expectations

            You MUST provide a substantive, developer-quality review on EVERY run. A review that just says "no issues found" is not acceptable. You are a peer reviewer — evaluate the work like a senior developer would during a pull request review.

            ### On every run, you MUST:

            1. **Read the full PR diff** using `gh pr diff ${{ github.event.pull_request.number }}`.
            2. **Read any prior review comments** on this PR using `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments` and `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments`. If you previously flagged issues that have since been fixed, explicitly acknowledge that in your review.
            3. **Provide a substantive assessment** of the changes — their quality, design, completeness, and fitness for purpose. Do not just scan for bugs; evaluate the work as a whole.

            ### When the trigger is `synchronize` (new commits pushed):

            In addition to the above, compare what changed since the last review:
            - Identify what was added, modified, or removed in the new commits.
            - Evaluate whether the new changes improve the PR, introduce regressions, or leave prior feedback unaddressed.
            - Explicitly call out any prior review feedback that has been addressed (or not).

            ### For Architecture Documentation (docs/architecture/*.md)

            1. **Technical Accuracy**
               - Are the architecture descriptions correct and internally consistent?
               - Do they accurately reflect the implementation patterns described?
               - Are cross-references to the spec repo accurate and up to date?

            2. **Implementation Quality**
               - Are design patterns well-justified and appropriate?
               - Is the separation of concerns clear?
               - Are extension points and plugin boundaries well-defined?

            3. **Consistency with Spec**
               - Do implementation details align with normative definitions in the spec repo?
               - Are CRUDE operation semantics correctly implemented?
               - Is introspection behavior consistent with the protocol specification?

            ### For TypeScript Code (src/**/*.ts, when present)

            1. **Correctness** - Does the code implement the spec faithfully?
            2. **Type Safety** - Are TypeScript types properly used?
            3. **Error Handling** - Are discriminated responses used correctly?
            4. **Testing** - Are tests present and meaningful?

            ### For CI/Workflow Files (.github/workflows/*.yml)

            1. **Security** - Are there script injection vulnerabilities from `${{ }}` interpolation in `run:` blocks? Values from PR context (titles, branch names, file lists) MUST be passed via `env:` blocks, never interpolated directly.
            2. **Correctness** - Will the workflows trigger on the right events? Are permissions appropriate?
            3. **Consistency** - Do the workflows follow the same patterns as sibling repos (spec, examples)?

            ### For Configuration Files (.cspell.json, .markdownlint.json, .lychee.toml)

            1. **Org consistency** - Do configs match the org-wide standards from the spec repo?
            2. **Completeness** - Are repo-specific terms included in the cspell dictionary?

            ### For All Files

            1. **Markdown quality** - Proper formatting, no lint errors expected
            2. **Spelling** - No typos in prose
            3. **Links** - All links should be valid

            ## Output Format

            Post a SINGLE comment using `gh pr comment` with the following structure:

            ### Summary
            One paragraph describing what this PR does and its overall quality.

            ### Review
            A substantive evaluation of the changes. Discuss the design decisions, implementation quality, completeness, and any concerns. This should read like a thoughtful peer review, not a checklist.

            ### Issues
            Specific problems that should be addressed, with `file:line` references. If there are none, say so briefly and explain why (e.g., "The changes are straightforward config additions with no logic to get wrong.").

            ### Prior Feedback
            If this is a `synchronize` event (new push), list any prior review comments and whether they were addressed. If this is the first review, omit this section.

            ### Suggestions
            Optional improvements, clearly marked as non-blocking.

            ### Verdict
            APPROVE, REQUEST_CHANGES, or COMMENT — with a brief justification.

          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api:*),Read,Glob,Grep"
